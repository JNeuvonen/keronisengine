name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check_public_tree.sh
        env:
          CI: "1"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --no-cache-dir -r src/py/cpp_live_proxy/cpp_live_proxy/requirements.txt
          pip install --no-cache-dir --no-deps ./src/py/cpp_live_proxy
          CPP_LIVE_PROXY_TEST_MODE=1 python3 -c "import cpp_live_proxy.main as m; assert len(m.app.routes) > 20"

  build:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-tool
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool pkg-config bison flex python3-venv
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir pyarrow
      - run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - run: echo "ORT=$(./scripts/fetch_onnxruntime.sh)" >> "$GITHUB_ENV"
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DONNXRUNTIME_ROOT="$ORT"
      - run: cmake --build build
      - run: ./build/bin/trading_engine_tests
      - run: ./build/bin/live_infra_tests "[state_machines],[paper_exchange],[paper_trading],[quote_holds],[normalized_trade],[lighter_market_data],[ohlcv]"
      - run: PYTHON=.venv/bin/python ./examples/quickstart_backtest/run.sh ./build/bin/backtest_runner
