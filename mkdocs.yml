site_name: KeronisEngine
site_description: C++20 trading engine with streaming state machines, ONNX inference, and live/backtest parity.
site_url: https://engine.keronis.ai/
repo_url: https://github.com/JNeuvonen/keronisengine
repo_name: JNeuvonen/keronisengine

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Architecture: architecture.md
      - Strategies: strategies.md
      - State Machines & ONNX: state-machines.md
      - Comparison: comparison.md
  - Operations:
      - Live & Paper Trading: live-and-paper.md
      - Control Server API: control-server.md
      - Configuration: configuration.md
