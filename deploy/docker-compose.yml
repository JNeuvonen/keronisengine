services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-keronis}
      POSTGRES_USER: ${DB_USER:-keronis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-keronis_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed_paper_strategy.sql:/docker-entrypoint-initdb.d/02_seed_paper_strategy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-keronis} -d ${DB_NAME:-keronis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-auth", "${NATS_TOKEN:-keronis_dev_nats_token}"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  ccxt_proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    environment:
      ACCOUNTS_JSON_PATH: /config/accounts.json
      USE_TESTNET: ${USE_TESTNET:-1}
      SPAWN_PRIVATE_STREAMS: ${SPAWN_PRIVATE_STREAMS:-1}
      EMIT_GCP_LOGS: "0"
    ports:
      - "127.0.0.1:${CCXT_PROXY_PORT:-8000}:8000"
    volumes:
      - ./accounts.json:/config/accounts.json:ro

volumes:
  pgdata:
